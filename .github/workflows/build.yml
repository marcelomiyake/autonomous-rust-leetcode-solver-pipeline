name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
          persist-credentials: false
      - name: Install LLVM coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Rust code
        run: cargo check --locked --all-targets --all-features
      - name: Run Rust tests
        run: cargo test --locked --all-targets --all-features
      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Generate LCOV coverage report
        run: |
          set -o pipefail
          if cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info 2>&1 | tee .pipeline-coverage.log; then
            rm -f .pipeline-coverage.log
          elif grep -q "no coverage data found" .pipeline-coverage.log; then
            # The initial scaffold has no executable Rust item yet. Keep the report
            # valid so Sonar can run; solution PRs produce real coverage data.
            printf 'TN:\nend_of_record\n' > lcov.info
            rm -f .pipeline-coverage.log
          else
            cat .pipeline-coverage.log
            exit 1
          fi
      - name: SonarQube Scan
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
