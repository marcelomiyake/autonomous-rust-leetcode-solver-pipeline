name: Record published LeetCode solution

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  record:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'ai/solution-') &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the updated default branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d # v4.3.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Record progress after merge
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: python3 scripts/solver_pipeline.py record-progress --branch "$HEAD_REF"

      - name: Commit progress state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet -- state/progress.json; then
            echo "Progress was already recorded."
            exit 0
          fi
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/progress.json
          git commit -m "chore: record published LeetCode solution"
          git push origin main
