name: SonarCloud component analysis
'on':
  push:
    branches:
    - main
  pull_request: {}
  workflow_dispatch: {}
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      pr-number:
        required: true
        type: string
      pr-branch:
        required: true
        type: string
    secrets:
      SONAR_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: sonar-components-${{ inputs.pr-number || github.ref }}
  cancel-in-progress: true
jobs:
  analyze:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ inputs.ref || github.ref }}
        fetch-depth: 0
        persist-credentials: false
    - name: Prepare analysis inputs
      id: prepare
      run: git rev-parse --verify HEAD
    - name: Analyze pipeline
      if: ${{ !cancelled() && steps.prepare.outcome == 'success' }}
      uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
      with:
        args: >-
          -Dproject.settings=.sonar/pipeline.properties
          ${{ inputs.pr-number && format('-Dsonar.pullrequest.key={0} -Dsonar.pullrequest.branch={1} -Dsonar.pullrequest.base=main', inputs.pr-number, inputs.pr-branch) || '' }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io
